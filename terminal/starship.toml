add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold #FF6B4A)"
success_symbol = "[❯](bold #6FC3DF)"

[directory]
style = 'bold #6FC3DF'
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold #6FC3DF"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #D8E1DD"

[git_status]
format     = '[$all_status]($style)'
style      = "#FF8C1A"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
